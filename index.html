<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDay AIBS - Base de Connaissance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="header-content">
                <h1>🚀 TechDay Formation AIBS</h1>
                <p>Base de Connaissance Interactive</p>
            </div>
            <div class="connection-status" id="connection-status">
                <span id="status-icon">⏳</span>
                <span id="status-text">Connexion...</span>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main>
            <!-- SEARCH & FILTERS -->
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="🔍 Rechercher dans la base..."
                        class="search-input"
                    >
                    <button id="clear-search" class="clear-btn" style="display: none;">✕</button>
                </div>

                <div class="filters">
                    <label>Filtrer par étiquette :</label>
                    <div id="tags-container" class="tags-container"></div>
                </div>

                <div class="stats">
                    <span id="results-count">Chargement...</span>
                </div>
            </section>

            <!-- DATA DISPLAY -->
            <section class="data-section">
                <div id="data-container" class="data-container">
                    <div class="loading">
                        <p>⏳ Chargement des données...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer>
            <p>Versioning : Code (GitHub) + Données (Supabase)</p>
            <p id="footer-info">Connecté à Supabase</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
